spring:
  datasource:
    url: jdbc:mysql://localhost:3306/certificate_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

mybatis-plus:
  global-config:
    db-config:
      table-prefix:
      table-underline: true
      id-type: auto
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
  api-docs:
    groups:
      enabled: true